databases:
  - name: finance_tracker_db
    databaseName: finance_tracker
    user: finance_user

services:
  - type: web
    name: finance_tracker
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn finance_tracker.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finance_tracker_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: PYTHON_DECOUPLE_PATH
        value: .
