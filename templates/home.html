<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker — Take Control of Your Money</title>
    <meta name="description" content="Track expenses, manage budgets and gain AI-powered financial insights with Finance Tracker.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: #0F172A;
            color: #ffffff;
        }

        /* ─── Animated Background ─────────────────────────────────── */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            padding: 2rem;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at 20% 50%, rgba(52, 152, 219, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 80% 20%, rgba(46, 204, 113, 0.02) 0%, transparent 40%),
                radial-gradient(circle at 50% 80%, rgba(155, 89, 182, 0.015) 0%, transparent 40%);
            animation: bgShift 15s ease-in-out infinite alternate;
            z-index: 0;
        }

        @keyframes bgShift {
            0%   { transform: translate(0, 0) scale(1); }
            50%  { transform: translate(-2%, 1%) scale(1.02); }
            100% { transform: translate(1%, -1%) scale(1); }
        }

        /* Floating orbs - reduced opacity for subtlety */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.08;
            z-index: 0;
        }

        .orb-1 {
            width: 400px; height: 400px;
            background: #3498db;
            top: -100px; right: -100px;
            animation: float1 8s ease-in-out infinite;
        }

        .orb-2 {
            width: 300px; height: 300px;
            background: #27ae60;
            bottom: -50px; left: -80px;
            animation: float2 10s ease-in-out infinite;
        }

        .orb-3 {
            width: 250px; height: 250px;
            background: #9b59b6;
            top: 40%; left: 60%;
            animation: float3 12s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0); }
            50%      { transform: translate(-30px, 40px); }
        }
        @keyframes float2 {
            0%, 100% { transform: translate(0, 0); }
            50%      { transform: translate(40px, -30px); }
        }
        @keyframes float3 {
            0%, 100% { transform: translate(0, 0); }
            50%      { transform: translate(-20px, -40px); }
        }

        /* ─── Content ─────────────────────────────────────────────── */
        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 720px;
        }

        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: rgba(79, 70, 229, 0.15);
            color: #818cf8;
            border-radius: 16px;
            margin-bottom: 1.5rem;
            animation: bounce 2s ease-in-out infinite;
        }

        .floating-symbol {
            position: absolute;
            font-size: 1.3rem;
            animation: symbolFloat 4s ease-in-out infinite;
        }
        .sym-1 { top: -18px; left: -38px; animation-delay: 0s; }
        .sym-3 { bottom: 0;  left: -48px; animation-delay: 1.2s; }
        .sym-4 { bottom: 0;  right: -48px; animation-delay: 2.0s; }
        .sym-5 { top: 50%;   right: -55px; animation-delay: 2.8s; transform: translateY(-50%); }

        @keyframes symbolFloat {
            0%, 100% { opacity: 0.5; transform: translateY(0) scale(1); }
            50%      { opacity: 1;   transform: translateY(-6px) scale(1.15); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-12px); }
        }

        .hero-title {
            font-size: clamp(2.2rem, 6vw, 4rem);
            font-weight: 900;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 1.2rem;
            background: linear-gradient(135deg, #ffffff 0%, #a8d8ea 50%, #27ae60 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-subtitle {
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            font-weight: 400;
            color: #B8C0CC;
            line-height: 1.7;
            margin-bottom: 2.5rem;
            max-width: 560px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ─── CTA Button ──────────────────────────────────────────── */
        .cta-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 1rem 2.4rem;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            color: #fff;
            background: linear-gradient(135deg, #3498db 0%, #27ae60 100%);
            border: none;
            border-radius: 60px;
            text-decoration: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            box-shadow: 0 4px 25px rgba(52, 152, 219, 0.35);
        }

        .cta-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 40px rgba(52, 152, 219, 0.5);
        }

        .cta-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .cta-btn .arrow {
            transition: transform 0.25s ease;
        }

        .cta-btn:hover .arrow {
            transform: translateX(4px);
        }

        /* Shimmer effect */
        .cta-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%   { left: -100%; }
            50%  { left: 100%; }
            100% { left: 100%; }
        }

        /* ─── Feature Pills ───────────────────────────────────────── */
        .features {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
            margin-top: 3rem;
        }

        .feature-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.45rem 1rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #AAB2C0;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 50px;
            backdrop-filter: blur(10px);
            transition: background 0.2s, border-color 0.2s, color 0.2s;
        }

        .feature-pill:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.85);
        }

        .footer {
            width: 100%;
            text-align: center;
            padding: 2rem 1rem 1.5rem;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.35);
            background: #0F172A;
            letter-spacing: 0.02em;
        }

        /* ─── Top Nav ─────────────────────────────────────────────── */
        .top-nav {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 1.25rem;
            color: #fff;
            text-decoration: none;
        }

        .login-link {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: color 0.2s;
        }

        .login-link:hover {
            color: #fff;
        }

        .login-btn {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.5rem 1.25rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: background 0.2s;
        }

        .login-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* ─── Responsive ──────────────────────────────────────────── */
        @media (max-width: 480px) {
            .cta-btn {
                padding: 0.85rem 1.8rem;
                font-size: 1rem;
            }

            .features {
                gap: 0.5rem;
            }

            .feature-pill {
                font-size: 0.78rem;
                padding: 0.45rem 0.9rem;
            }
        }
    </style>
</head>

<body>
    <nav class="top-nav">
        <a href="/" class="brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <line x1="2" y1="10" x2="22" y2="10"></line>
                <line x1="6" y1="16" x2="6.01" y2="16"></line>
                <line x1="10" y1="16" x2="10.01" y2="16"></line>
            </svg>
            FinTrack
        </a>
        <div class="login-link">
            <span style="display: none; @media(min-width: 640px){ display: inline; }">Already have an account?</span>
            <a href="/auth/login/" class="login-link login-btn">Log in</a>
        </div>
    </nav>

    <section class="hero">
        <!-- Floating orbs -->
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>

        <div class="hero-content">
            <div class="logo-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                    <line x1="2" y1="10" x2="22" y2="10"></line>
                    <line x1="6" y1="16" x2="6.01" y2="16"></line>
                    <line x1="10" y1="16" x2="10.01" y2="16"></line>
                </svg>
            </div>
            <h1 class="hero-title">Take control of your finances</h1>
            <p class="hero-subtitle">
                Track your spending, manage your budgets, and understand your money — all in one place.
            </p>

            <a href="/auth/register/" class="cta-btn" id="get-started-btn">
                Get Started
                <span class="arrow">→</span>
            </a>

            <div class="features">
                <span class="feature-pill">📊 Smart Dashboard</span>
                <span class="feature-pill">💳 Transaction Tracking</span>
                <span class="feature-pill">🎯 Budget Management</span>
                <span class="feature-pill">💡 Financial Insights</span>
            </div>
        </div>

    </section>

    <div class="footer">
        &copy; 2026 FinTrack. Built with ❤️
    </div>
</body>

</html>
